[workspace]

[package]
name = "offline-patch"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
description = "Reversible offline profile patcher for Horizon: Minecraft Java Edition in Rust"
repository = "https://github.com/PiBOH/offhorizon"
build = "build.rs"

[[bin]]
name = "offline-patch"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
