name: Auto Release

# PiBOH's release convention: a push whose first line starts with "v" is a release.
# The version comes from version.txt, the single source of truth (AGENTS.md). A suffix
# (-nightly, -beta, -alpha, -rc) makes the GitHub release a pre-release. A changelog is
# optional; when CHANGELOG.md has a `## [<version>]` section, it is used as the body.
on:
  push:
    branches: [offhorizon]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty to use version.txt)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  version:
    name: Read version.txt
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          RAW="${VERSION_INPUT:-$(sed -n '1p' version.txt | tr -d '\r\n' | xargs)}"
          VERSION="${RAW#v}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::version.txt is empty"
            exit 1
          fi
          TAG="v${VERSION}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (prerelease: $PRERELEASE)"

  # The platforms a release must have. macOS is separate and best-effort: when GitHub has no
  # macOS runner for this fork, the release still goes out for Linux and Windows.
  build:
    name: Build ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            asset: OffHorizon-Launcher-Linux-x86_64
            binary: horizon-launcher
          - name: windows-x64
            os: windows-latest
            asset: OffHorizon-Launcher-Windows-x64.exe
            binary: horizon-launcher.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: auto-release-${{ matrix.name }}
      - name: Linux libraries GPUI links to
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libvulkan-dev libasound2-dev patchelf
      - name: Keep Cargo versions in step with version.txt
        run: python3 ../tools/sync_version.py
      - name: Build
        run: cargo build --release --locked
      - name: The version is version.txt's
        shell: bash
        run: |
          out=$(./target/release/${{ matrix.binary }} --version)
          echo "$out"
          [[ "$out" == "horizon-launcher ${{ needs.version.outputs.version }}" ]] || {
            echo "::error::expected horizon-launcher ${{ needs.version.outputs.version }}"
            exit 1
          }
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p ../dist
          cp "target/release/${{ matrix.binary }}" "../dist/${{ matrix.asset }}"
          chmod +x "../dist/${{ matrix.asset }}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\dist | Out-Null
          Copy-Item "target\release\${{ matrix.binary }}" "..\dist\${{ matrix.asset }}"
          # The same program under the name that makes it the installer (`installer::is_setup_exe`):
          # run this one and it copies itself into %LOCALAPPDATA%\Programs\OffHorizon Launcher,
          # makes the Start menu shortcut and the Apps entry, and starts the installed copy.
          Copy-Item "target\release\${{ matrix.binary }}" "..\dist\OffHorizon-Setup-Windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  macos:
    name: Build macos-x64 (opt-in)
    # A queued job on a fork without a macOS runner keeps the whole run queued and
    # holds the auto-release concurrency group, so newer releases never start.
    # Set the repository variable OFFHORIZON_MACOS=true when a runner is available.
    if: vars.OFFHORIZON_MACOS == 'true'
    needs: version
    continue-on-error: true
    runs-on: macos-13
    timeout-minutes: 45
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: auto-release-macos-x64
      - name: Keep Cargo versions in step with version.txt
        run: python3 ../tools/sync_version.py
      - name: Build
        run: cargo build --release --locked
      - name: The version is version.txt's
        shell: bash
        run: |
          out=$(./target/release/horizon-launcher --version)
          echo "$out"
          [[ "$out" == "horizon-launcher ${{ needs.version.outputs.version }}" ]] || {
            echo "::error::expected horizon-launcher ${{ needs.version.outputs.version }}"
            exit 1
          }
      - name: Package
        shell: bash
        run: |
          mkdir -p ../dist
          cp target/release/horizon-launcher ../dist/OffHorizon-Launcher-macOS-x64
          chmod +x ../dist/OffHorizon-Launcher-macOS-x64
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-x64
          path: dist/OffHorizon-Launcher-macOS-x64
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    # macOS is best effort: its runner can stay queued for hours on a fork, and waiting for it
    # would hold every release. Linux and Windows decide the release; the macOS job may still
    # finish afterwards, but it never blocks this one.
    needs: [version, build]
    if: always() && needs.version.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Source archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="OffHorizon-${GITHUB_SHA:0:7}/" \
            -o "artifacts/OffHorizon-source.tar.gz" "$GITHUB_SHA"
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -- * > SHA256SUMS
      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          SECTION=""
          if [[ -f CHANGELOG.md ]]; then
            SECTION=$(awk -v v="$VERSION" '
              index($0, "## [" v "]") == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)
          fi
          if [[ -z "$SECTION" ]]; then
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [[ -n "$PREV" ]]; then
              SECTION=$(git log "$PREV..HEAD" --pretty=format:'- %s' --no-merges)
            else
              SECTION=$(git log --max-count=30 --pretty=format:'- %s' --no-merges)
            fi
          fi
          if [[ "$VERSION" == *-* ]]; then CHANNEL=nightly; else CHANNEL=stable; fi
          {
            echo "## OffHorizon $VERSION"
            echo
            echo "Release channel: \`$CHANNEL\`"
            echo
            echo "$SECTION"
            echo
            echo "---"
            echo "The launcher starts the Rust game and Java instances with an offline account,"
            echo "without a Microsoft sign-in. It installs Horizon game builds from"
            echo "[horizon-rust/horizon](https://github.com/horizon-rust/horizon); online servers"
            echo "still need a Microsoft account."
            echo
            echo "**OffHorizon is an unofficial fork. It is not approved by or associated with"
            echo "horizon-rust, Mojang or Microsoft.**"
            echo
            echo "Built automatically from commit \`$GITHUB_SHA\`."
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: OffHorizon ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          files: artifacts/*
          fail_on_unmatched_files: true
          body_path: notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
