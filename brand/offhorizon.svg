<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <title>Horizon Red Fracture</title>
  <defs>
    <!-- Forma base con angoli arrotondati -->
    <clipPath id="tile"><rect width="16" height="16" rx="3.5" /></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Sfondo originale -->
    <rect width="16" height="16" fill="#16181f" />

    <!-- Elementi grafici interni originali -->
    <g fill="#ecedf3">
      <rect x="4" y="3" width="2" height="4" />
      <rect x="10" y="3" width="2" height="4" />
    </g>
    <g fill="#ecedf3" opacity=".36">
      <rect x="4" y="8" width="2" height="4" />
      <rect x="10" y="8" width="2" height="4" />
    </g>
    <rect y="7" width="16" height="1" fill="#9a86ff" />

    <!-- Spaccatura unica rossa fulminante (con alone luminoso) -->
    <!-- alone sfumato/glow -->
    <polyline points="8,-1 9.5,3 6.5,6.5 10.5,10 7.5,13 9,17" fill="none" stroke="#ff1e1e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

    <!-- Nucleo fulminante principale -->
    <polyline points="8,-1 9.5,3 6.5,6.5 10.5,10 7.5,13 9,17" fill="none" stroke="#ff4d4d" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="8,-1 9.5,3 6.5,6.5 10.5,10 7.5,13 9,17" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
